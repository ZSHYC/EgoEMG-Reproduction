<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">EgoEMG independent reproduction</title>
  <desc id="desc">Original academic banner showing wrist EMG waveforms and an egocentric camera leading to a hand skeleton, with an emphasis on pinned source and traceable evaluation.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#102238"/><stop offset="1" stop-color="#19394c"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#c6f1eb" stroke-opacity=".05"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="20" fill="url(#background)"/>
  <rect width="1280" height="400" rx="20" fill="url(#grid)"/>
