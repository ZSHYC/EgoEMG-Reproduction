    <text x="50" y="172" fill="#f5f9fc" font-size="92" font-weight="700" letter-spacing="-3">EgoEMG</text>
    <text x="56" y="222" fill="#d3e2ec" font-size="27">Wrist EMG. Egocentric vision. Hand pose.</text>
    <text x="57" y="265" fill="#a8c0d0" font-size="21">A transparent path from released data to evaluation.</text>
    <path d="M56 301H631" stroke="#416174"/>
    <circle cx="63" cy="339" r="5" fill="#2dd4bf"/>
    <text x="79" y="346" fill="#d3e2ec" font-size="17" letter-spacing="1">PINNED SOURCE</text>
    <circle cx="272" cy="339" r="5" fill="#f6c76a"/>
    <text x="288" y="346" fill="#d3e2ec" font-size="17" letter-spacing="1">TRACEABLE RESULTS</text>
  </g>
