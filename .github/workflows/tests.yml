name: Reproduction checks
on:
  push:
  pull_request:
jobs:
  unit-light:
    name: Metadata and optional-runtime checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test,vision,report,emg2pose]'
      - name: Check out the approved source for metadata and AST checks
        run: bash scripts/bootstrap_upstream.sh "${{ github.workspace }}/upstream"
      # Pure metadata/statistics use pinned source. Torch integration remains
      # opt-in here; this tier deliberately does not install a model runtime.
      - run: python -m pytest -q -ra
      - run: bash -n scripts/*.sh
  official-cpu:
    name: Pinned CPU official-model fixture checks
    runs-on: ubuntu-latest
    env:
      EGOEMG_UPSTREAM: ${{ github.workspace }}/upstream
      EGOEMG_NO_PRETRAINED_DOWNLOAD: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU model runtime
        run: |
          python -m pip install numpy==1.26.4 pytest==8.2.2 hydra-core==1.3.2 scipy==1.13.1
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.2.2+cpu torchvision==0.17.2+cpu
          python -m pip install -e '.[test,vision,dinov2,report,emg2pose,emg2pose-runtime,official-reader]'
          python -m pip check
      - name: Check out the approved official source
        run: bash scripts/bootstrap_upstream.sh "$EGOEMG_UPSTREAM"
      # Engineering fixtures run without weight/data downloads. GPU and real-data
      # acceptance remain separately recorded experimental evidence.
      # Genuine checkpoint fixtures are large. Release each passing test's own
      # scratch directory at teardown; retain failed cases for diagnosis.
      - run: python -m pytest -q -ra -o tmp_path_retention_policy=failed
      - name: Report disk and retained test scratch usage
        if: always()
        run: |
          df -h / /tmp
          python - <<'PY'
          from pathlib import Path
          import subprocess
          roots = [str(p) for p in Path('/tmp').glob('pytest-of-*') if p.is_dir()]
          if roots:
              subprocess.run(['du', '-sh', *roots], check=False)
          PY
      - run: bash -n scripts/*.sh
