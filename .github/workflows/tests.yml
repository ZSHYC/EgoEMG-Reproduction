name: Reproduction checks
on:
  push:
  pull_request:
jobs:
  unit-light:
    name: Metadata and optional-runtime checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the pinned legacy namespace for readonly fixtures
        run: git fetch --no-tags --depth=1 origin 8dc57cdd667cb05341cb3f79064c59f58d27f7f8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test,vision,report,emg2pose]'
      - name: Check out the approved source for metadata and AST checks
        run: bash scripts/bootstrap_upstream.sh "${{ github.workspace }}/upstream"
      # Pure metadata/statistics use pinned source. Torch integration remains
      # opt-in here; this tier deliberately does not install a model runtime.
      - run: python -m pytest -q -ra
      - run: bash -n scripts/*.sh
  official-cpu:
    name: Pinned CPU official-model fixture checks
    runs-on: ubuntu-latest
    env:
      EGOEMG_UPSTREAM: ${{ github.workspace }}/upstream
      EGOEMG_NO_PRETRAINED_DOWNLOAD: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the pinned legacy namespace for readonly fixtures
        run: git fetch --no-tags --depth=1 origin 8dc57cdd667cb05341cb3f79064c59f58d27f7f8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU model runtime
        run: |
          python -m pip install numpy==1.26.4 pytest==8.2.2 hydra-core==1.3.2 scipy==1.13.1
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.2.2+cpu torchvision==0.17.2+cpu
          python -m pip install -e '.[test,vision,dinov2,report,emg2pose,emg2pose-runtime,official-reader]'
          python -m pip check
      - name: Check out the approved official source
        run: bash scripts/bootstrap_upstream.sh "$EGOEMG_UPSTREAM"
      - name: Prefetch and verify the genuine DINO-S test prerequisite
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          from huggingface_hub import hf_hub_download, try_to_load_from_cache
          cache = Path(os.environ['RUNNER_TEMP'])/'egoemg-dino-hf'
          repo = 'timm/vit_small_patch14_dinov2.lvd142m'
          revision = '4610ca143709d58a633b6397a74412c2c3842454'
          path = Path(hf_hub_download(repo, 'model.safetensors', revision=revision, cache_dir=cache, token=False))
          assert path.stat().st_size == 88240510
          assert hashlib.sha256(path.read_bytes()).hexdigest() == '04d27f3400d059fc0cfd7d17dd1909a75bf3ea8fb3eeb48b97cb99e57ee20081'
          # The unchanged native factory requests main. Bind only this owned
          # isolated cache to the verified commit; do not reroute its transport.
          ref = cache/('models--'+repo.replace('/', '--'))/'refs/main'
          ref.parent.mkdir(parents=True, exist_ok=True)
          ref.write_text(revision)
          assert Path(try_to_load_from_cache(repo, 'model.safetensors', revision='main', cache_dir=cache)).resolve() == path.resolve()
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('EGOEMG_VISION_TEST_HF_CACHE='+str(cache)+'\n')
              out.write('EGOEMG_REQUIRE_VISION_PRETRAINED_TEST=1\n')
          PY
      # Runtime tests construct models offline after explicit asset preparation.
      # GPU and real-data acceptance remain separate experimental evidence.
      # Genuine checkpoint fixtures are large. Release each passing test's own
      # scratch directory at teardown; retain failed cases for diagnosis.
      # Hosted /tmp can be an 8GiB tmpfs. Real artifact transactions retain the
      # production 15GiB reserve, so use the runner's disk-backed scratch path.
      - run: python -m pytest -q -ra -o tmp_path_retention_policy=failed --basetemp="${RUNNER_TEMP}/egoemg-pytest"
      - name: Report disk and retained test scratch usage
        if: always()
        run: |
          df -h / /tmp "$RUNNER_TEMP"
          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          roots = [str(p) for p in Path('/tmp').glob('pytest-of-*') if p.is_dir()]
          selected = Path(os.environ['RUNNER_TEMP'])/'egoemg-pytest'
          if selected.is_dir():
              roots.append(str(selected))
          if roots:
              subprocess.run(['du', '-sh', *roots], check=False)
          PY
      - run: bash -n scripts/*.sh
