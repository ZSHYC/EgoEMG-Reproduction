[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egoemg-reproduction"
version = "0.1.0"
description = "Version-pinned EgoEMG reproduction and evaluation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<2", "gdown>=5.2,<6", "requests>=2.31", "tqdm>=4.65"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
vision = ["Pillow==11.0.0", "lmdb==1.7.3"]
dinov2 = ["timm==1.0.15", "huggingface-hub==0.28.1", "safetensors==0.5.2"]
emg2pose = ["h5py==3.11.0"]
emg2pose-runtime = ["h5py==3.11.0", "hydra-core==1.3.2", "scipy==1.13.1", "pandas==2.2.3", "joblib==1.5.2", "pytorch-lightning==2.5.0.post0", "torchmetrics==1.4.3", "lightning-utilities==0.11.9", "setuptools==75.6.0", "torch==2.2.2", "torchvision==0.17.2"]
# Add to the model/vision extras to import the complete official reader for
# reference comparisons; the nonvisual wrapper itself does not require cv2.
official-reader = ["opencv-python-headless==4.10.0.84"]
report = ["matplotlib==3.9.4", "contourpy<1.4"]

[tool.setuptools.packages.find]
include = ["egoemg_repro*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
